name: Build Venus guest driver

# The runtime half of the Mali bridge: Arch Linux ARM's Venus Vulkan driver (vulkan-virtio) and
# vulkaninfo, packed in an Arch Linux ARM container on an arm64 runner and published as a release
# asset the apk build fetches (tools/venus/release.env names the tag and sha). The app half, the
# Venus server, is built for Android by tools/venus/build-host.sh in Build APK.
on:
  push:
    paths:
      - 'tools/venus/**'
      - '.github/workflows/build-venus.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish as (e.g. venus-guest-26.2-p1); empty = artifact only'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # The app half on its own, for a quick answer on a server change without a whole apk build;
  # Build APK runs the same script for the apk.
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the Venus server for Android
        run: |
          set -euo pipefail
          pip install --user meson==1.6.1
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          tools/venus/build-host.sh venus-host
      - uses: actions/upload-artifact@v4
        with:
          name: venus-host
          path: venus-host/*.so

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux ARM
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work menci/archlinuxarm:base-devel bash tools/venus/build-guest-in-arch.sh
          sudo chown -R "$(id -u):$(id -g)" .
      - uses: actions/upload-artifact@v4
        with:
          name: venus-guest
          path: |
            venus-guest.tzst
            venus-guest.tzst.sha256
      - name: Publish
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --notes "Arch Linux ARM's Venus Vulkan driver ($(tar --use-compress-program=unzstd -xOf venus-guest.tzst usr/local/lib/droiddeck-venus/VERSION | tr '\n' ' ')) and vulkaninfo; staged by the apk at /usr/local/lib/droiddeck-venus for Mali sessions. sha256 $(cut -d' ' -f1 venus-guest.tzst.sha256)" venus-guest.tzst venus-guest.tzst.sha256 || gh release upload "${{ inputs.tag }}" venus-guest.tzst venus-guest.tzst.sha256 --clobber
